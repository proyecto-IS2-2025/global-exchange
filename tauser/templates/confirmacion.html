{% extends "base.html" %}
{% load static %}
{% load humanize %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-4">
                <h3 class="mb-0">
                    <i class="fas fa-check-circle fa-3x mb-3"></i>
                    <br>
                    ¡Operación Exitosa!
                </h3>
            </div>
            
            <div class="card-body p-5">
                <div class="alert alert-success" role="alert">
                    <h4 class="alert-heading">
                        <i class="fas fa-thumbs-up me-2"></i>
                        Transacción Completada
                    </h4>
                    <hr>
                    <p class="mb-0">
                        Su operación ha sido procesada correctamente en la terminal {{ terminal.nombre }}.
                    </p>
                </div>

                <div class="mt-4 text-center">
                    <a href="{% url 'tauser:transacciones_cliente' terminal_codigo=terminal.codigo cliente_id=cliente.id %}" 
                       class="btn btn-primary btn-lg me-2">
                        <i class="fas fa-arrow-left me-2"></i>
                        Volver a Transacciones
                    </a>
                    
                    <form method="post" action="{% url 'tauser:cerrar_sesion' terminal_codigo=terminal.codigo %}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-lg">
                            <i class="fas fa-sign-out-alt me-2"></i>
                            Cerrar Sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
